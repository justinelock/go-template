services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: Root123456
      MYSQL_DATABASE: go_template_db
    ports:
      - "3306:3306"
    volumes:
      - ./db/go_template_db.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pRoot123456"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redis1234
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis1234", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  member-service:
    build: .
    command: ["/srv/bin/member-service"]
    environment:
      APP_ENV: dev
      CONFIG_FILE: configs/app.dev.json
      SERVICE_HOST: member-service
      LOG_FORMAT: json
    ports:
      - "8181:8181"
      - "9181:9181"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8181/readyz"]
      interval: 5s
      timeout: 5s
      retries: 12

  order-service:
    build: .
    command: ["/srv/bin/order-service"]
    environment:
      APP_ENV: dev
      CONFIG_FILE: configs/app.dev.json
      SERVICE_HOST: order-service
      LOG_FORMAT: json
    ports:
      - "8182:8182"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8182/readyz"]
      interval: 5s
      timeout: 5s
      retries: 12

  payment-service:
    build: .
    command: ["/srv/bin/payment-service"]
    environment:
      APP_ENV: dev
      CONFIG_FILE: configs/app.dev.json
      SERVICE_HOST: payment-service
      LOG_FORMAT: json
      PAYMENT_MOCK_PAY_ENABLED: "true"
    ports:
      - "8183:8183"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8183/readyz"]
      interval: 5s
      timeout: 5s
      retries: 12

  gateway-service:
    build: .
    command: ["/srv/bin/gateway-service"]
    environment:
      APP_ENV: dev
      CONFIG_FILE: configs/app.dev.json
      LOG_FORMAT: json
      RATE_LIMIT_ENABLED: "false"
    ports:
      - "8180:8180"
    depends_on:
      member-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8180/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    profiles: ["obs"]
    image: jaegertracing/all-in-one:1.64.0
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
