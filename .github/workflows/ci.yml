# 默认不自动运行：仅在 GitHub Actions 页手动「Run workflow」触发。
# 若需 push/PR 自动跑 CI，取消下方 on.push / on.pull_request 注释。
name: CI

on:
  workflow_dispatch:
    inputs:
      run_compose_smoke:
        description: Run docker compose smoke (auth + order)
        type: boolean
        default: true
  # push:
  #   branches: [main, master]
  # pull_request:
  #   branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run unit tests
        run: go test ./...

      - name: Build services
        run: go build -o /dev/null ./cmd/gateway-service ./cmd/member-service ./cmd/order-service

  compose-smoke:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_compose_smoke }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          chmod +x ./scripts/smoke-auth-flow.sh ./scripts/smoke-order-flow.sh
          for i in {1..45}; do
            gw_ok=0
            order_ok=0
            curl -fsS "http://127.0.0.1:8180/healthz" >/dev/null && gw_ok=1
            curl -fsS "http://127.0.0.1:8182/healthz" >/dev/null && order_ok=1
            if [[ "$gw_ok" -eq 1 && "$order_ok" -eq 1 ]]; then
              echo "gateway and order-service are healthy"
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for services"
          docker compose ps
          docker compose logs --tail=80 gateway-service order-service member-service rabbitmq
          exit 1

      - name: Run smoke test
        run: |
          BASE_URL=http://127.0.0.1:8180 ./scripts/smoke-auth-flow.sh
          BASE_URL=http://127.0.0.1:8180 ./scripts/smoke-order-flow.sh

      - name: Stop stack
        if: always()
        run: docker compose down -v
