name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run unit tests
        run: go test ./...

      - name: Build services
        run: go build -o /dev/null ./cmd/gateway-service ./cmd/member-service

  compose-smoke:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait gateway health
        run: |
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:8180/healthz" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Run smoke test
        run: BASE_URL=http://127.0.0.1:8180 ./scripts/smoke-auth-flow.sh

      - name: Stop stack
        if: always()
        run: docker compose down -v
