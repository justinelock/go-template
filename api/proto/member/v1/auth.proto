syntax = "proto3";

package member.v1;

option go_package = "pricing-assistant/api/gen/member/v1;memberv1";

service AuthService {
  rpc Introspect (IntrospectRequest) returns (IntrospectResponse);
}

message IntrospectRequest {
  string token = 1;
  string trace_id = 2;
}

message IntrospectResponse {
  int32 code = 1;
  string message = 2;
  string user_id = 3;
  string trace_id = 4;
}
