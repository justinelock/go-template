openapi: 3.0.3
info:
  title: go-template API
  version: 0.5.0
servers:
  - url: http://127.0.0.1:8180
paths:
  /v1/auth/login:
    post:
      summary: Login
  /v1/auth/register:
    post:
      summary: Register
  /v1/auth/refresh:
    post:
      summary: Refresh access token
  /v1/order/orders:
    post:
      summary: Create order
  /v1/order/orders/{id}:
    get:
      summary: Get order
  /v1/payment/payments:
    post:
      summary: Create payment
  /v1/payment/payments/{id}/mock-pay:
    post:
      summary: Mock pay (dev only)
